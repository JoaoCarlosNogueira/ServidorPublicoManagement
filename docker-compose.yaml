services:
  postgres:
    image: postgres:15
    container_name: postgrescontainer
    restart: always
    environment:
      POSTGRES_DB: seplag
      POSTGRES_USER: joao
      POSTGRES_PASSWORD: 1234
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmincontainer
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"  # Mapeia a porta 5050 do host para a 80 do container
    depends_on:
      - postgres

  minio:
    image: minio/minio
    container_name: miniocontainer
    restart: always
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: admin123
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  minio_data:
